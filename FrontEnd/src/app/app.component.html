<!-- Splash screen -->
@if (!appReady) {
  <div class="splash-overlay" [class.fade-out]="appReady">
    <div class="splash-content">
      <span class="splash-brand">ABO BAKR</span>
      <p class="splash-message">Capturing your precious moments</p>
      <div class="splash-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
}

<!-- App content -->
@if (appReady) {
  <div class="app-shell">
    @if (showNavbar) {
      <app-navbar />
    }
    <main [class.main-content]="showNavbar" [class.page-reveal]="isAnimating">
      <router-outlet />
    </main>
    @if (showNavbar) {
      <app-footer />
    }
  </div>
}
