<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-logo" aria-label="Home" (click)="closeMenu()">
      <span class="navbar-brand">ABO BAKR</span>
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <ul class="nav-links" [class.open]="menuOpen">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      </li>
      <li>
        <a routerLink="/packages" routerLinkActive="active" (click)="closeMenu()">Packages</a>
      </li>
      <li>
        <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a>
      </li>
      @if (authService.isLoggedIn) {
        <li>
          <a routerLink="/events" routerLinkActive="active" (click)="closeMenu()">Events</a>
        </li>
      }
      <li>
        <a routerLink="/feedbacks" routerLinkActive="active" (click)="closeMenu()">Feedbacks</a>
      </li>
      @if (authService.isLoggedIn) {
        <li class="logout-item">
          <button class="logout-btn" (click)="logout()">Logout</button>
        </li>
      }
    </ul>
  </div>
</nav>
