@if (visible) {
  <div class="modal-overlay" (click)="close()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ isEdit ? 'Edit Event' : 'Create Event' }}</h2>
        <button class="close-btn" (click)="close()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form (ngSubmit)="submit()" class="modal-form">
        <div class="form-group">
          <label for="eventName">Event Name (Bride & Groom)</label>
          <input id="eventName" type="text" [(ngModel)]="name" name="name" placeholder="e.g. Ahmed & Sara" required />
        </div>

        <div class="form-group">
          <label>Cover / Background Image</label>
          <div class="cover-upload" (click)="coverInput.click()">
            @if (coverPreview) {
              <img [src]="coverPreview" alt="Cover preview" class="cover-preview" />
              <span class="cover-change">Change</span>
            } @else {
              <div class="cover-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>Click to upload cover</span>
              </div>
            }
          </div>
          <input #coverInput type="file" accept="image/jpeg,image/png,image/webp" hidden (change)="onCoverSelected($event)" />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
          <button type="submit" class="btn-save">{{ isEdit ? 'Update' : 'Create' }}</button>
        </div>
      </form>
    </div>
  </div>
}
